[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "floodfill-bg"
version = "0.1.0"
description = "Flood-fill background removal tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    "click>=8.0.0",
]

[project.scripts]
floodfill-bg = "floodfill_bg:main"

[tool.setuptools]
# Declared explicitly: this is a flat layout with a top-level module
# beside a package, which setuptools auto-discovery refuses to guess at.
py-modules = ["floodfill_bg"]
packages = ["floodfill_bg_libs"]
